  <body>
    <div class="containerLogin">
      <form action="login.php" method="post" class="formBox">
        <h1 class="formTitle">Ingresa a tu cuenta</h1>

        <input
          class="loginInput"
          type="email"
          name="email"
          placeholder="📧 Ingresa tu email"
          required
        />

        <input
          class="loginInput"
          type="password"
          name="password"
          placeholder="🔒 Ingresa tu clave de usuario"

        <input
          class="loginSubmit"
          type="submit"
          name="login"
          value="Iniciar sesión"
        />

        <p class="textRegister">
          ¿Aún no tienes cuenta?<br />
